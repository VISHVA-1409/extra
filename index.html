<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExtraLearn</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      overflow: hidden;
      position: relative;
    }

    /* Animated background particles */
    .particles {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      bottom: -10px;
    }

    .particle:nth-child(odd) {
      animation: float-up-left 12s infinite ease-in-out;
    }

    .particle:nth-child(even) {
      animation: float-up-right 12s infinite ease-in-out;
    }

    @keyframes float-up-left {
      0% {
        transform: translateY(0) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 0.7;
      }
      90% {
        opacity: 0.5;
      }
      100% {
        transform: translateY(-110vh) translateX(-30px);
        opacity: 0;
      }
    }

    @keyframes float-up-right {
      0% {
        transform: translateY(0) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 0.7;
      }
      90% {
        opacity: 0.5;
      }
      100% {
        transform: translateY(-110vh) translateX(30px);
        opacity: 0;
      }
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 80px;
      padding: 60px;
      max-width: 1300px;
      z-index: 1;
      position: relative;
    }

    /* LEFT – Illustration */
    .illustration {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.3s ease;
    }

    .illustration:hover {
      transform: scale(1.05);
    }

    .server {
      width: 180px;
      background: linear-gradient(145deg, #1a1a2e, #0f0f1e);
      border-radius: 15px;
      padding: 20px 0;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4),
                  inset 0 -2px 10px rgba(255,255,255,0.1);
      animation: float 4s ease-in-out infinite;
      position: relative;
      overflow: hidden;
    }

    .server::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.05), transparent);
      animation: shine 3s infinite;
    }

    @keyframes shine {
      0% { transform: translateX(-100%) translateY(-100%); }
      100% { transform: translateX(100%) translateY(100%); }
    }

    .server .row {
      height: 10px;
      background: linear-gradient(90deg, #00d4ff, #0095ff, #7b2ff7);
      margin: 12px 20px;
      border-radius: 8px;
      animation: pulse 2s infinite alternate;
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
      position: relative;
      overflow: hidden;
    }

    .server .row::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      animation: scan 2s infinite;
    }

    @keyframes scan {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .server .row:nth-child(1) { animation-delay: 0s; }
    .server .row:nth-child(2) { animation-delay: 0.3s; }
    .server .row:nth-child(3) { animation-delay: 0.6s; }
    .server .row:nth-child(4) { animation-delay: 0.9s; }

    .database {
      width: 130px;
      height: 130px;
      background: linear-gradient(145deg, #f5f5f5, #e0e0e0);
      border-radius: 50%;
      margin-top: 40px;
      position: relative;
      box-shadow: inset 0 -15px 20px rgba(0,0,0,0.15),
                  0 20px 40px rgba(0,0,0,0.3);
      animation: database-pulse 3s ease-in-out infinite;
    }

    @keyframes database-pulse {
      0%, 100% { transform: scale(1); box-shadow: inset 0 -15px 20px rgba(0,0,0,0.15), 0 20px 40px rgba(0,0,0,0.3); }
      50% { transform: scale(1.05); box-shadow: inset 0 -15px 20px rgba(0,0,0,0.15), 0 25px 50px rgba(123,47,247,0.3); }
    }

    .database::before,
    .database::after {
      content: "";
      position: absolute;
      left: 15px;
      right: 15px;
      height: 12px;
      background: linear-gradient(145deg, #ddd, #ccc);
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .database::before { top: 35px; }
    .database::after { top: 60px; }

    .gear {
      position: absolute;
      top: -30px;
      right: -30px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ffd700, #ffed4e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      color: #333;
      animation: spin 8s linear infinite;
      box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .gear:hover {
      animation: spin 2s linear infinite;
      box-shadow: 0 15px 40px rgba(255, 215, 0, 0.6);
      transform: scale(1.1);
    }

    /* RIGHT – Text */
    .content h1 {
      font-size: 72px;
      line-height: 1.1;
      margin-bottom: 25px;
      background: linear-gradient(135deg, #fff, #e0e0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: title-glow 2s ease-in-out infinite alternate;
    }

    @keyframes title-glow {
      from { filter: drop-shadow(0 0 10px rgba(255,255,255,0.3)); }
      to { filter: drop-shadow(0 0 20px rgba(255,255,255,0.6)); }
    }

    .content h1 span {
      display: block;
      font-weight: 700;
      background: linear-gradient(135deg, #00d4ff, #7b2ff7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .content p {
      font-size: 20px;
      opacity: 0.95;
      max-width: 480px;
      margin-bottom: 35px;
      line-height: 1.6;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }

    .status-container {
      margin-bottom: 25px;
    }

    .status-label {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .progress {
      width: 100%;
      height: 12px;
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
      backdrop-filter: blur(10px);
    }

    .progress span {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #00d4ff, #7b2ff7, #ff006e);
      background-size: 200% 100%;
      animation: load 4s ease-out forwards, gradient-shift 2s ease-in-out infinite;
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.6);
      border-radius: 10px;
    }

    @keyframes load {
      0% { width: 0; }
      100% { width: 85%; }
    }

    @keyframes gradient-shift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .notify-btn {
      margin-top: 25px;
      padding: 14px 32px;
      background: linear-gradient(135deg, #00d4ff, #7b2ff7);
      border: none;
      border-radius: 30px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(123, 47, 247, 0.3);
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .notify-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(123, 47, 247, 0.5);
      background: linear-gradient(135deg, #7b2ff7, #00d4ff);
    }

    .notify-btn:active {
      transform: translateY(-1px);
    }

    /* Animations */
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    @keyframes pulse {
      from { opacity: 0.5; }
      to { opacity: 1; }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      text-align: center;
      padding: 15px 20px;
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(10px);
      font-size: 14px;
      z-index: 2;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .footer .copyright {
      color: rgba(255,255,255,0.9);
    }

    /* Responsive */
    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
        text-align: center;
        padding: 40px 25px 100px 25px;
        gap: 50px;
      }

      .illustration {
        justify-content: center;
      }

      .content {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .content h1 {
        font-size: 48px;
      }

      .content p {
        font-size: 17px;
        max-width: 100%;
      }

      .status-container {
        width: 100%;
      }

      .notify-btn {
        width: 100%;
        max-width: 300px;
      }
    }

    @media (max-width: 500px) {
      .container {
        padding: 30px 20px 100px 20px;
        gap: 40px;
      }

      .content h1 {
        font-size: 36px;
      }

      .content h1 span {
        font-size: 40px;
      }

      .content p {
        font-size: 16px;
      }

      .server {
        width: 150px;
      }

      .database {
        width: 110px;
        height: 110px;
      }

      .gear {
        width: 80px;
        height: 80px;
        font-size: 40px;
        top: -25px;
        right: -25px;
      }
    }
  </style>
   <link rel="icon" href="logo.png" type="image/png">
</head>
<body>

  <div class="particles" id="particles"></div>

  <div class="container">
    <div class="illustration">
      <div class="gear" title="Click me!">⚙️</div>
      <div class="server">
        <div class="row"></div>
        <div class="row"></div>
        <div class="row"></div>
        <div class="row"></div>
      </div>
      <div class="database"></div>
    </div>

    <div class="content">
      <h1>SERVER <span>MAINTENANCE</span></h1>
      <p>
        We're upgrading our systems to serve you better.
        Your experience is about to get even more amazing!
      </p>
      
      <div class="status-container">
        <div class="status-label">Progress Status</div>
        <div class="progress"><span></span></div>
      </div>

      <button class="notify-btn" onclick="notifyMe()">Notify Me When Ready</button>
    </div>
  </div>

  <footer class="footer">
    <p class="copyright">Copyright © 2026 Software Development, Gudiyattam 632-602.</p>
  </footer>

  <script>
    // Create organized floating particles
    const particlesContainer = document.getElementById('particles');
    const particleCount = 25;
    const spacing = 100 / particleCount;
    
    for (let i = 0; i < particleCount; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      
      // Distribute particles evenly across the width
      particle.style.left = (i * spacing + (spacing / 2)) + '%';
      
      // Stagger the animation delays for a wave effect
      particle.style.animationDelay = (i * 0.4) + 's';
      particle.style.animationDuration = '12s';
      
      particlesContainer.appendChild(particle);
    }

    // Notify button functionality
    function notifyMe() {
      const btn = event.target;
      btn.textContent = '✓ You\'ll be notified!';
      btn.style.background = 'linear-gradient(135deg, #00c853, #00e676)';
      
      setTimeout(() => {
        btn.textContent = 'Notify Me When Ready';
        btn.style.background = 'linear-gradient(135deg, #00d4ff, #7b2ff7)';
      }, 3000);
    }

    // Interactive gear click
    document.querySelector('.gear').addEventListener('click', function() {
      this.style.animation = 'none';
      setTimeout(() => {
        this.style.animation = 'spin 2s linear infinite';
      }, 10);
    });
  </script>

</body>
</html>
